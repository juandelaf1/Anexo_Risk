# CI mínima (aditiva). Anexo_Risk_limpio es fork colaborativo (Equipo Nexo, MIT) — respetar atribución (P7).
name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest
      - name: Run tests
        run: |
          if [ -d tests ] || ls pytest.ini pyproject.toml 2>/dev/null | grep -q .; then pytest -q; else echo "no tests config detected; skipping"; fi
