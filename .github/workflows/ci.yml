name: CI

on:
  push:
    branches: [main, anexo-risk, feature/auth-jwt]
  pull_request:
    branches: [main, dev, anexo-risk, feature/auth-jwt]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar claves efímeras para tests
        shell: bash
        run: |
          ANEXO_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          JWT_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$ANEXO_KEY"
          echo "::add-mask::$JWT_KEY"
          echo "ANEXO_ADMIN_KEY=$ANEXO_KEY" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$JWT_KEY" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        env:
          DATABASE_URL: sqlite:///./backend/anexo_risk.db
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar imports de anexo_risk
        env:
          DATABASE_URL: sqlite:///./backend/anexo_risk.db
        run: |
          python -c "from main import app; print('OK', app.title)"

      - name: Poblar datos de demostración
        env:
          DATABASE_URL: sqlite:///./backend/anexo_risk.db
        working-directory: backend
        run: |
          PYTHONPATH=. python db/seed.py

      - name: Ejecutar tests
        env:
          DATABASE_URL: sqlite:///./backend/anexo_risk.db
        run: |
          cd ..
          PYTHONPATH=backend python -m pytest tests/backend/ -v --ignore=tests/backend/test_global_sources.py

  frontend-static-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar SPA entry point
        run: |
          test -f frontend/index.html
          test -f frontend/js/spa.js
          test -f frontend/manifest.json

      - name: Verificar que no hay referencias visibles a NEXO
        run: |
          ! grep -i "NEXO" frontend/index.html
          ! grep -i "NEXO" frontend/manifest.json
          echo "Identidad limpia: OK"
